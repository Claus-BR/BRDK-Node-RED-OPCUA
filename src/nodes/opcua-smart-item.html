<!--
  @file opcua-smart-item.html
  @description Editor definition for the OPC UA Smart Item node.

  Features:
    - Editable list of OPC UA items (nodeId, datatype, browseName)
    - Live treeview browser panel that connects to the server
    - Click tree nodes to add them to the items list
    - Drag handle for reordering items
-->

<!-- ═══════════════════════════════════════════════════════════════════════════
     1. NODE REGISTRATION
     ═══════════════════════════════════════════════════════════════════════ -->
<script type="text/javascript">
  RED.nodes.registerType('opcua-smart-item', {
    category: 'BRDK OPCUA',
    color: '#3FADB5',
    defaults: {
      name: { value: '' },
      endpoint: { value: '', type: 'opcua-endpoint', required: true },
      items: { value: '[]' },
      method: { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-sitemap',
    align: 'right',
    label: function () {
      if (this.name) return this.name;
      var items = [];
      try {
        items = JSON.parse(this.items || '[]');
      } catch (e) {}
      if (items.length === 1) return items[0].browseName || items[0].nodeId || 'Opcua Smart Item';
      if (items.length > 1) return items.length + ' items';
      return 'Opcua Smart Item';
    },
    labelStyle: function () {
      return this.name ? 'node_label_italic' : '';
    },
    paletteLabel: 'opcua smart item',

    oneditprepare: function () {
      var node = this;
      var items = [];
      try {
        items = JSON.parse(node.items || '[]');
      } catch (e) {
        items = [];
      }
      node._smartItems = items;

      // ── Items list rendering ───────────────────────────────────────
      var $list = $('#smart-item-list');
      var $valuesList = $('#smart-item-values-list');

      function renderItems() {
        $list.empty();
        items.forEach(function (item, idx) {
          var $row = $('<div class="smart-item-row" data-idx="' + idx + '"></div>');
          $row.append(
            '<span class="smart-item-nodeId" title="' + item.nodeId + '">' + item.nodeId + '</span>'
          );
          $row.append('<span class="smart-item-type">' + (item.datatype || '') + '</span>');
          $row.append('<span class="smart-item-name">' + (item.browseName || '') + '</span>');
          var $remove = $(
            '<button class="red-ui-button red-ui-button-small smart-item-remove" title="Remove"><i class="fa fa-times"></i></button>'
          );
          $remove.on('click', function () {
            items.splice(idx, 1);
            renderItems();
            renderValues();
          });
          $row.append($remove);
          $list.append($row);
        });
        renderValues();
      }

      function renderValues() {
        $valuesList.empty();
        if (items.length === 0) {
          $valuesList.append('<div class="smart-item-values-empty">No items configured</div>');
          return;
        }
        items.forEach(function (item, idx) {
          var label = item.browseName || item.nodeId;
          var $row = $('<div class="smart-item-value-row"></div>');
          $row.append(
            '<span class="smart-item-value-label" title="' + item.nodeId + '">' + label + '</span>'
          );
          var $input = $(
            '<input type="text" class="smart-item-value-input" placeholder="(no value)">'
          );
          $input.val(item.value || '');
          $input.on('change', function () {
            items[idx].value = $(this).val();
          });
          $row.append($input);
          $valuesList.append($row);
        });
      }

      renderItems();

      // ── Manual add ─────────────────────────────────────────────────
      $('#smart-item-manual-isArray').on('change', function () {
        var checked = $(this).is(':checked');
        $('#smart-item-array-toggle').toggleClass('active', checked);
        $('#smart-item-array-toggle .array-toggle-icon.off').toggle(!checked);
        $('#smart-item-array-toggle .array-toggle-icon.on').toggle(checked);
      });

      $('#smart-item-add-btn').on('click', function () {
        var nodeId = $('#smart-item-manual-nodeId').val().trim();
        if (!nodeId) return;
        var dt = $('#smart-item-manual-datatype').val() || '';
        if ($('#smart-item-manual-isArray').is(':checked')) dt += 'Array';
        items.push({
          nodeId: nodeId,
          datatype: dt,
          browseName: '',
          value: '',
        });
        $('#smart-item-manual-nodeId').val('');
        $('#smart-item-manual-isArray').prop('checked', false).trigger('change');
        renderItems();
      });

      // ── Tree browser ───────────────────────────────────────────────
      var $tree = $('#smart-item-tree');
      var $browseBtn = $('#smart-item-browse-btn');
      var $browseStatus = $('#smart-item-browse-status');
      var browseCache = {};

      $browseBtn.on('click', function () {
        var endpointId = $('#node-input-endpoint').val();
        if (!endpointId || endpointId === '_ADD_') {
          $browseStatus.text('Select an endpoint first').show();
          return;
        }
        $tree.empty();
        browseCache = {};
        $('#smart-item-server-name').hide();

        $browseStatus.text('Connecting...').show();
        browseNode(endpointId, 'ns=0;i=84', $tree, 0);
      });

      function browseNode(endpointId, nodeId, $parent, depth, onEmpty) {
        if (browseCache[nodeId]) {
          if (browseCache[nodeId].length === 0 && onEmpty) onEmpty();
          else renderChildren(browseCache[nodeId], $parent, endpointId, depth, nodeId);
          return;
        }

        $.getJSON('opcua-smart-item/browse', { endpointId: endpointId, nodeId: nodeId })
          .done(function (data) {
            var children = data.children || data;
            browseCache[nodeId] = children;
            $browseStatus.hide();

            // Show server name from the OPC UA server on root browse
            if (depth === 0 && data.serverName) {
              $('#smart-item-server-name').text(data.serverName).show();
            }

            if (children.length === 0) {
              if (depth === 0) $browseStatus.text('No items found').show();
              if (onEmpty) onEmpty();
              return;
            }
            renderChildren(children, $parent, endpointId, depth, nodeId);
          })
          .fail(function (xhr) {
            var msg = 'Browse failed';
            try {
              msg = JSON.parse(xhr.responseText).error || msg;
            } catch (e) {}
            $browseStatus.text(msg).show();
            if (onEmpty) onEmpty();
          });
      }

      function renderChildren(children, $parent, endpointId, depth, parentNodeId) {
        children.forEach(function (child) {
          var $node = $('<div class="tree-node" style="padding-left:' + depth * 18 + 'px;"></div>');

          // Expand toggle
          if (child.hasChildren) {
            var $toggle = $('<span class="tree-toggle"><i class="fa fa-caret-right"></i></span>');
            var expanded = false;
            var $childContainer = $('<div class="tree-children" style="display:none;"></div>');

            $toggle.on('click', function (e) {
              e.stopPropagation();
              expanded = !expanded;
              $toggle.find('i').toggleClass('fa-caret-right fa-caret-down');
              if (expanded) {
                $childContainer.show();
                if ($childContainer.children().length === 0) {
                  browseNode(endpointId, child.nodeId, $childContainer, depth + 1, function () {
                    // No children — hide the arrow
                    $toggle.replaceWith('<span class="tree-toggle-placeholder"></span>');
                    $childContainer.remove();
                  });
                }
              } else {
                $childContainer.hide();
              }
            });

            $node.append($toggle);
          } else {
            $node.append('<span class="tree-toggle-placeholder"></span>');
          }

          // Icon — differentiate folders, variables, arrays, methods
          var iconClass = 'fa-folder';
          if (child.isMethod) {
            iconClass = 'fa-cog';
          } else if (child.isVariable && child.isArray) {
            iconClass = 'fa-th-list';
          } else if (child.isVariable) {
            iconClass = 'fa-cube';
          }
          $node.append('<i class="fa ' + iconClass + ' tree-icon"></i>');

          // Label
          var label = child.displayName || child.browseName;
          if (child.dataType) {
            var dtLabel = child.isArray ? child.dataType + 'Array' : child.dataType;
            label += ' <span class="tree-datatype">[' + dtLabel + ']</span>';
          }
          var $label = $('<span class="tree-label">' + label + '</span>');
          $node.append($label);

          // Hover info
          (function (c) {
            $node.on('mouseenter', function () {
              var info = c.nodeId;
              if (c.dataType) info += '  \u2022  ' + c.dataType;
              $('#smart-item-info-text').text(info);
            });
          })(child);

          // Add button for variables
          if (child.isVariable) {
            var $addBtn = $(
              '<button class="red-ui-button red-ui-button-small tree-add-btn" title="Add to items"><i class="fa fa-plus"></i></button>'
            );
            $addBtn.on('click', function (e) {
              e.stopPropagation();
              // Check if already added
              var exists = items.some(function (it) {
                return it.nodeId === child.nodeId;
              });
              if (exists) return;
              items.push({
                nodeId: child.nodeId,
                datatype: child.dataType
                  ? child.isArray
                    ? child.dataType + 'Array'
                    : child.dataType
                  : '',
                browseName: child.displayName || child.browseName,
              });
              renderItems();
              $addBtn.prop('disabled', true).find('i').removeClass('fa-plus').addClass('fa-check');
            });
            $node.append($addBtn);
          }

          // Set-method button for Method nodes
          if (child.isMethod) {
            var $methodBtn = $(
              '<button class="red-ui-button red-ui-button-small tree-add-btn" title="Configure method"><i class="fa fa-cog"></i></button>'
            );
            (function (c, pId) {
              $methodBtn.on('click', function (e) {
                e.stopPropagation();
                setMethod(c, pId, endpointId);
              });
            })(child, parentNodeId);
            $node.append($methodBtn);
          }

          $parent.append($node);

          // Append child container after the node
          if (child.hasChildren) {
            $parent.append($childContainer);
          }
        });
      }

      // ── Method configuration ───────────────────────────────────────
      var methodConfig = null;
      try {
        methodConfig = JSON.parse(node.method || 'null');
      } catch (e) {}

      var $methodSection = $('#smart-item-method-section');
      var $methodInfo = $('#smart-item-method-info');
      var $methodArgs = $('#smart-item-method-args');
      var $removeMethodBtn = $('#smart-item-remove-method-btn');

      // Check if a dataType name is an ExtensionObject / structured type
      // (not one of the built-in scalar types)
      var SCALAR_TYPES = [
        'Boolean',
        'SByte',
        'Byte',
        'Int16',
        'UInt16',
        'Int32',
        'UInt32',
        'Int64',
        'UInt64',
        'Float',
        'Double',
        'String',
        'DateTime',
        'ByteString',
        'Guid',
        'XmlElement',
        'NodeId',
        'ExpandedNodeId',
        'StatusCode',
        'QualifiedName',
        'LocalizedText',
      ];
      function isExtensionObjectType(dtName) {
        if (!dtName) return false;
        return !SCALAR_TYPES.includes(dtName);
      }

      // Fetch ExtensionObject fields from the server
      function fetchExtensionFields(endpointId, dataTypeNodeId, argIdx) {
        $.getJSON('opcua-smart-item/type-fields', {
          endpointId: endpointId,
          dataTypeNodeId: dataTypeNodeId,
        })
          .done(function (data) {
            if (
              data.fields &&
              data.fields.length > 0 &&
              methodConfig &&
              methodConfig.inputArguments[argIdx]
            ) {
              methodConfig.inputArguments[argIdx].fields = data.fields;
              // Initialize value object with empty strings for each field
              var val = methodConfig.inputArguments[argIdx].value;
              if (typeof val !== 'object' || val === null) val = {};
              data.fields.forEach(function (f) {
                if (val[f.name] === undefined) val[f.name] = '';
              });
              methodConfig.inputArguments[argIdx].value = val;
              renderMethod();
            }
          })
          .fail(function () {
            // Mark as non-extension so it falls back to a single text input
            if (methodConfig && methodConfig.inputArguments[argIdx]) {
              methodConfig.inputArguments[argIdx].isExtensionObject = false;
              // Reset value from {} to empty string for scalar rendering
              if (typeof methodConfig.inputArguments[argIdx].value === 'object') {
                methodConfig.inputArguments[argIdx].value = '';
              }
              renderMethod();
            }
          });
      }

      function renderMethod() {
        if (!methodConfig) {
          $methodSection.hide();
          $(
            '#smart-item-items-section, #smart-item-manual-section, #smart-item-values-section'
          ).show();
          return;
        }
        $methodSection.show();
        $(
          '#smart-item-items-section, #smart-item-manual-section, #smart-item-values-section'
        ).hide();
        var label = methodConfig.browseName || methodConfig.methodId;
        $methodInfo.html(
          '<b>' +
            label +
            '</b>' +
            '<span class="smart-item-method-detail">Object: <code>' +
            methodConfig.objectId +
            '</code></span>' +
            '<span class="smart-item-method-detail">Method: <code>' +
            methodConfig.methodId +
            '</code></span>'
        );

        $methodArgs.empty();
        var args = methodConfig.inputArguments || [];
        if (args.length === 0) {
          $methodArgs.append('<div class="smart-item-values-empty">No input arguments</div>');
        } else {
          args.forEach(function (arg, idx) {
            var $row = $('<div class="smart-item-method-arg-row"></div>');
            $row.append(
              '<span class="smart-item-method-arg-name">' + (arg.name || 'Arg ' + idx) + '</span>'
            );
            $row.append(
              '<span class="smart-item-method-arg-type">' + (arg.dataType || '') + '</span>'
            );

            // ExtensionObject: render sub-fields list
            if (arg.isExtensionObject && arg.fields && arg.fields.length > 0) {
              var $fieldsContainer = $('<div class="smart-item-ext-fields"></div>');
              // Initialize value as object if not already
              if (typeof arg.value !== 'object' || arg.value === null) {
                arg.value = {};
              }
              arg.fields.forEach(function (field) {
                var $fieldRow = $('<div class="smart-item-ext-field-row"></div>');
                $fieldRow.append(
                  '<span class="smart-item-ext-field-name">' + field.name + '</span>'
                );
                $fieldRow.append(
                  '<span class="smart-item-ext-field-type">' + field.dataType + '</span>'
                );
                var placeholder =
                  field.defaultValue && typeof field.defaultValue !== 'object'
                    ? String(field.defaultValue)
                    : '';
                var $fieldInput = $(
                  '<input type="text" class="smart-item-ext-field-value" placeholder="' +
                    placeholder +
                    '">'
                );
                var currentVal = arg.value[field.name];
                $fieldInput.val(currentVal && typeof currentVal !== 'object' ? currentVal : '');
                (function (fieldName) {
                  $fieldInput.on('change', function () {
                    if (typeof methodConfig.inputArguments[idx].value !== 'object') {
                      methodConfig.inputArguments[idx].value = {};
                    }
                    methodConfig.inputArguments[idx].value[fieldName] = $(this).val();
                  });
                })(field.name);
                $fieldRow.append($fieldInput);
                $fieldsContainer.append($fieldRow);
              });
              $row.append($fieldsContainer);
            } else if (arg.isExtensionObject && (!arg.fields || arg.fields.length === 0)) {
              // ExtensionObject but fields not yet loaded — show loading
              $row.append('<span class="smart-item-method-loading">&nbsp;loading fields…</span>');
            } else {
              // Scalar: single value input
              var $input = $(
                '<input type="text" class="smart-item-method-arg-value" placeholder="Value">'
              );
              var scalarVal = arg.value && typeof arg.value !== 'object' ? arg.value : '';
              $input.val(scalarVal);
              $input.on('change', function () {
                methodConfig.inputArguments[idx].value = $(this).val();
              });
              $row.append($input);
            }

            $methodArgs.append($row);
          });
        }
      }

      function setMethod(child, parentNodeId, endpointId) {
        methodConfig = {
          objectId: parentNodeId,
          methodId: child.nodeId,
          browseName: child.displayName || child.browseName,
          inputArguments: [],
        };
        renderMethod();

        // Fetch InputArguments from the server
        $methodInfo.append('<span class="smart-item-method-loading"> — fetching arguments…</span>');
        $.getJSON('opcua-smart-item/method-args', {
          endpointId: endpointId,
          methodId: child.nodeId,
        })
          .done(function (data) {
            $('.smart-item-method-loading').remove();
            if (data.inputArguments && data.inputArguments.length > 0) {
              methodConfig.inputArguments = data.inputArguments.map(function (a) {
                var isExt = isExtensionObjectType(a.dataType);
                return {
                  name: a.name,
                  dataType: a.dataType,
                  dataTypeNodeId: a.dataTypeNodeId || '',
                  description: a.description,
                  valueRank: a.valueRank,
                  isExtensionObject: isExt,
                  fields: [],
                  value: isExt ? {} : '',
                };
              });
              renderMethod();

              // For each ExtensionObject arg, fetch its fields
              methodConfig.inputArguments.forEach(function (arg, idx) {
                if (arg.isExtensionObject && arg.dataTypeNodeId) {
                  fetchExtensionFields(endpointId, arg.dataTypeNodeId, idx);
                }
              });
            } else {
              renderMethod();
            }
          })
          .fail(function () {
            $('.smart-item-method-loading').text(' — could not fetch arguments');
          });
      }

      $removeMethodBtn.on('click', function () {
        methodConfig = null;
        renderMethod();
      });

      renderMethod();
      node._methodConfig = function () {
        return methodConfig;
      };
    },

    oneditsave: function () {
      if (this._smartItems) {
        var json = JSON.stringify(this._smartItems);
        $('#node-input-items').val(json);
      }
      var mc = this._methodConfig ? this._methodConfig() : null;
      $('#node-input-method').val(mc ? JSON.stringify(mc) : '');
    },
  });
</script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     2. STYLES
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
  /* ── Items list ─────────────────────────────────────────────────── */
  #smart-item-list {
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px;
    max-height: 180px;
    overflow-y: auto;
    margin-bottom: 8px;
    background: var(--red-ui-form-input-background-color, #fff);
  }
  .smart-item-row {
    display: flex;
    align-items: center;
    padding: 4px 6px;
    border-bottom: 1px solid var(--red-ui-tertiary-border-color, #eee);
    font-size: 12px;
    gap: 6px;
  }
  .smart-item-row:last-child {
    border-bottom: none;
  }
  .smart-item-nodeId {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: monospace;
  }
  .smart-item-type {
    color: var(--red-ui-text-color-info, #888);
    min-width: 60px;
    text-align: center;
    font-size: 11px;
  }
  .smart-item-name {
    color: var(--red-ui-text-color-info, #666);
    min-width: 80px;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .smart-item-value {
    width: 80px;
    min-width: 60px;
    padding: 1px 4px;
    font-size: 11px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 3px;
    background: var(--red-ui-form-input-background-color, #fff);
  }
  .smart-item-value::placeholder {
    font-style: italic;
    opacity: 0.5;
  }
  .smart-item-remove {
    flex-shrink: 0;
  }

  /* ── Values list ────────────────────────────────────────────────── */
  #smart-item-values-list {
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px;
    max-height: 180px;
    overflow-y: auto;
    margin-bottom: 8px;
    background: var(--red-ui-form-input-background-color, #fff);
  }
  .smart-item-value-row {
    display: flex;
    align-items: center;
    padding: 4px 6px;
    border-bottom: 1px solid var(--red-ui-tertiary-border-color, #eee);
    font-size: 12px;
    gap: 8px;
  }
  .smart-item-value-row:last-child {
    border-bottom: none;
  }
  .smart-item-value-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .smart-item-value-input {
    width: 120px;
    min-width: 80px;
    padding: 2px 6px;
    font-size: 12px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 3px;
    background: var(--red-ui-form-input-background-color, #fff);
  }
  .smart-item-value-input::placeholder {
    font-style: italic;
    opacity: 0.5;
  }
  .smart-item-values-empty {
    padding: 8px;
    color: var(--red-ui-text-color-info, #888);
    font-style: italic;
    font-size: 12px;
    text-align: center;
  }

  /* ── Manual add ───────────────────────────────────────────────── */
  .smart-item-add-card {
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 12px;
    background: var(--red-ui-form-input-background-color, #fff);
  }
  .smart-item-add-field {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .smart-item-add-field:last-child {
    margin-bottom: 0;
  }
  .smart-item-add-field label.field-label {
    font-size: 12px;
    color: var(--red-ui-text-color-info, #888);
    width: 55px;
    flex-shrink: 0;
    margin: 0;
    text-align: right;
  }
  .smart-item-add-field input[type='text'],
  .smart-item-add-field select {
    flex: 1;
    font-size: 13px;
  }
  .smart-item-add-field .array-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    font-size: 11px;
    cursor: pointer;
    margin: 0;
    flex-shrink: 0;
    padding: 4px 8px;
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 3px;
    background: var(--red-ui-form-input-background-color, #fff);
    color: var(--red-ui-text-color-info, #888);
    user-select: none;
    transition:
      background 0.15s,
      border-color 0.15s,
      color 0.15s;
  }
  .smart-item-add-field .array-toggle:hover {
    border-color: var(--red-ui-text-color-info, #999);
  }
  .smart-item-add-field .array-toggle.active {
    background: var(--red-ui-node-config-color, #d1e0f0);
    border-color: var(--red-ui-text-color-link, #4b8bbf);
    color: var(--red-ui-text-color, #333);
    font-weight: 500;
  }
  .smart-item-add-field .array-toggle input[type='checkbox'] {
    display: none;
  }
  .smart-item-add-field .array-toggle .array-toggle-icon {
    margin-right: 3px;
    font-size: 10px;
  }
  .smart-item-add-field .array-toggle .array-toggle-icon.off {
    color: var(--red-ui-text-color-error, #c33);
  }
  .smart-item-add-field .array-toggle .array-toggle-icon.on {
    color: #3a3;
  }

  /* ── Tree browser ───────────────────────────────────────────────── */
  #smart-item-tree-container {
    border: 1px solid var(--red-ui-form-input-border-color, #ccc);
    border-radius: 4px 4px 0 0;
    max-height: 300px;
    overflow: auto;
    background: var(--red-ui-form-input-background-color, #fff);
    padding: 4px;
  }

     4. HELP TEXT
     ═══════════════════════════════════════════════════════════════════════ -->
<script type="text/html" data-help-name="opcua-smart-item">
  <p>Configures one or more OPC UA items with live server browsing support.</p>

  <h3>Features</h3>
  <ul>
    <li>
      <b>Live treeview</b> — Browse the server's address space directly from the editor. Click
      <b>Connect &amp; Browse</b> to load the tree, then click <i class="fa fa-plus"></i> next to
      any variable to add it.
    </li>
    <li>
      <b>Multiple items</b> — Add as many variables as needed. They are sent to the Client node in
      the correct format for <code>read</code>, <code>write</code>, or
      <code>subscribe</code> actions.
    </li>
    <li><b>Manual entry</b> — Type a NodeId directly if you know the address.</li>
  </ul>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>msg.items <span class="property-type">array</span></dt>
    <dd>
      Array of <code>{ nodeId, datatype, browseName, value? }</code> objects. Always an array, even
      for a single item. The <code>value</code> property is included only when a static value is
      configured for the item.
    </dd>
    <dt>msg.topic <span class="property-type">string</span></dt>
    <dd>The first item's NodeId (for display / convenience).</dd>
  </dl>

  <h3>Usage</h3>
  <p>
    Place this node before an <b>OPC UA Client</b> node. For <code>read</code> or
    <code>subscribe</code> actions, the Smart Item provides the item metadata. For
    <code>write</code>, set a static value per item in the editor. The value is coerced to the
    correct OPC UA type based on the item's datatype. Leave the value empty for items that are only
    used for reading.
  </p>
  <p>
    For dynamic writes (values determined at runtime), use a <b>Function</b> node to set
    <code>msg.items[n].value</code> before the message reaches the Client node.
  </p>

  <h3>Endpoint</h3>
  <p>
    The endpoint is required for the treeview browser. It uses the same connection details (URL,
    security, authentication) as your OPC UA Client node. The browse connection is ephemeral — it
    connects only when you click <b>Connect &amp; Browse</b> and disconnects immediately after.
  </p>
</script>
